name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 benchmark/ dashboard/ --max-line-length=100 --ignore=W503

      - name: Check formatting with black
        run: black --check benchmark/ dashboard/

      - name: Import check
        run: |
          python -c "import benchmark.benchmark"
          python -c "import benchmark.stress_test"
          python -c "import dashboard.plot_results"
        env:
          W3S_TOKEN: dummy_token_for_import_check
          PYTHONPATH: .
